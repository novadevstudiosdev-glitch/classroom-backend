name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ─── JOB 1: LINT + BUILD + TESTS ──────────────────────────────
  test:
    name: Lint, Build & E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Precheck E2E Secrets
        id: e2e_precheck
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$JWT_SECRET" ] || [ -z "$JWT_REFRESH_SECRET" ]; then
            echo "run_e2e=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping E2E tests because required secrets are missing."
          else
            echo "run_e2e=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tests E2E
        if: steps.e2e_precheck.outputs.run_e2e == 'true'
        env:
          NODE_ENV: test
          PORT: 3000
          API_PREFIX: api
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          JWT_REFRESH_EXPIRES_IN: 7d
          REDIS_URL: ${{ secrets.REDIS_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FRONTEND_URL: http://localhost:3001
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALLBACK_URL: http://localhost:3000/api/auth/google/callback
        run: npm run test:e2e

      - name: E2E Skipped Notice
        if: steps.e2e_precheck.outputs.run_e2e == 'false'
        run: echo "E2E tests skipped: missing required secrets in this workflow context."

# Railway detecta automáticamente cuando el CI pasa y deploya solo.
# Configurado en Railway → Settings → "Wait for CI" activado.
